# Apenas para desenvolvimento local. Produção usa Postgres serverless (Neon/Vercel Postgres)
# e Redis via Upstash REST — não há infraestrutura própria em produção.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: codevision
      POSTGRES_PASSWORD: codevision
      POSTGRES_DB: codevision_radar
    ports:
      - "5432:5432"
    volumes:
      - codevision_postgres_data:/var/lib/postgresql/data

volumes:
  codevision_postgres_data:
